apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: connectra
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP
  # Sticky sessions for internal pod to pod calls 
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
